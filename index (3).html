<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universal market</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FA;--card:#fff;--ink:#14213D;--mute:#5B6475;--line:#DDE3EA;--brand:#1B6CA8;--accent:#FFC857;--on-accent:#14213D;--red:#C62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--card:#16213A;--ink:#EEF2F8;--mute:#9AA6BC;--line:#26334F;--brand:#5AB0F0;--red:#FF8A80}}
:root[data-theme="dark"]{--bg:#0E1626;--card:#16213A;--ink:#EEF2F8;--mute:#9AA6BC;--line:#26334F;--brand:#5AB0F0;--red:#FF8A80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{padding:20px 0 8px}
.top{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:14px}
.top a,.top button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 14px Onest,sans-serif;text-decoration:none;cursor:pointer}
h1{font:700 clamp(28px,7vw,48px)/1.1 Unbounded,system-ui,sans-serif;margin:0 0 10px;letter-spacing:-.02em}
header p{margin:0;color:var(--mute);max-width:52ch}
#q{width:100%;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:16px Onest,sans-serif}
.hero{margin:20px 0 6px;padding:26px 20px;border-radius:20px;background:linear-gradient(135deg,#0F2F5C,#1B6CA8);color:#fff}
.hero h2{font:700 clamp(22px,5.5vw,34px)/1.15 Unbounded,sans-serif;margin:0 0 10px}
.hero p{margin:0 0 18px;max-width:46ch;opacity:.92}
.hbtn{display:flex;gap:10px;flex-wrap:wrap}
.hbtn a{padding:12px 20px;border-radius:12px;font-weight:600;text-decoration:none}
.hbtn .y{background:#FFC857;color:#14213D}
.hbtn .w{border:1.5px solid rgba(255,255,255,.75);color:#fff}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0 0}
.perks span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:500}
.item{transition:transform .15s}
.item:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.item{transition:none}.item:hover{transform:none}}
.tabs{display:flex;gap:8px;margin:14px 0 18px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font:500 15px Onest,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.pic{aspect-ratio:4/3;display:grid;place-items:center;font-size:44px;border:0;width:100%;cursor:pointer}
.badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font:600 13px Onest,sans-serif;padding:3px 9px;border-radius:999px}
.badge.new{background:var(--brand);color:#fff}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.tag{font-size:13px;color:var(--mute)}
.name{font-weight:600;text-align:left;background:none;border:0;color:inherit;font-family:inherit;font-size:16px;padding:0;cursor:pointer}
.price{font:700 16px Unbounded,sans-serif;margin-top:auto;padding-top:8px}
.price s{font:400 13px Onest,sans-serif;color:var(--mute);margin-left:6px}
.add{margin-top:8px;border:0;background:var(--accent);color:var(--on-accent);padding:10px;border-radius:10px;font:600 15px Onest,sans-serif;cursor:pointer}
button:focus-visible,a:focus-visible,#q:focus-visible,#addr:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
section.info{margin:36px 0 0;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
section.info h2{font:700 20px Unbounded,sans-serif;margin:0 0 8px}
section.info p{margin:0;color:var(--mute);max-width:60ch;white-space:pre-line}
footer{padding:20px 0 120px;color:var(--mute);font-size:14px}
footer a{color:var(--brand)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:0;overflow:auto;max-height:85vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dpic{aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center;font-size:64px}
.dbody{padding:16px;display:flex;flex-direction:column;gap:8px}
.dbody h2{margin:0;font:700 20px Unbounded,sans-serif}
.dbody p{margin:0;color:var(--mute)}
.dbtn{display:flex;gap:8px;margin-top:6px}
.dbtn button{flex:1;padding:11px;border-radius:10px;font:600 15px Onest,sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.dbtn .main{background:var(--accent);color:var(--on-accent);border:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar[hidden]{display:none}
#addr{padding:11px 12px;border-radius:10px;border:1px solid var(--line);font:16px Onest,sans-serif;color:var(--ink);background:var(--bg)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font:500 12px Onest,sans-serif;padding:4px 2px;cursor:pointer;position:relative}
.nav i{font-style:normal;font-size:22px}
.nav button[aria-current="true"]{color:var(--brand);font-weight:600}
.nav .mid{color:var(--ink);font-weight:600}
.nav .mid i{background:var(--accent);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin-top:-26px;font-size:25px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.nav b{position:absolute;top:-24px;left:calc(50% + 12px);background:var(--red);color:#fff;font:600 12px Onest,sans-serif;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.nav b[hidden]{display:none}
.fv{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.88);font-size:17px;cursor:pointer}
.crow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.crow small{color:var(--mute)}
.crow button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
#clear,#cx,#kx{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;margin-right:12px}
#cx,#kx{margin:4px 0 0}
#order,.kb{display:inline-block;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;padding:12px 18px;border-radius:10px;text-align:center}
.kb{display:block}
[hidden]{display:none!important}
#drev h3{font:700 16px Unbounded,sans-serif;margin:14px 0 4px}
.st{color:#E6A700;letter-spacing:1px}
.rv{border-top:1px solid var(--line);padding:8px 0}
.rv p{margin:2px 0}
.rv img{max-width:100%;border-radius:8px;margin-top:6px}
.pick{display:flex;gap:4px}
.pick button{background:none;border:0;font-size:28px;color:#E6A700;cursor:pointer;padding:0 2px}
.rf{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.rf input,.rf textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px Onest,sans-serif}
.rf .note{font-size:13px;color:var(--mute)}
#rs{display:block;text-align:center;text-decoration:none;padding:11px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font:600 15px Onest,sans-serif;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;white-space:nowrap}
#toast.show{opacity:1}
.pic{overflow:hidden}
#sort{width:100%;margin-top:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:16px Onest,sans-serif}
.szs{display:flex;gap:6px;flex-wrap:wrap}
.szs:empty{display:none}
.szb{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:500 14px Onest,sans-serif}
.szb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
details p{margin-top:6px}
.bar a{background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;padding:10px 18px;border-radius:10px}
.bar button{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer}

#adm{width:min(560px,96vw);max-height:92vh}
.mut{color:var(--mute);font-size:14px;margin:0}
.arow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.arow.off{opacity:.45}
.ath{width:64px;height:64px;flex:none;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:28px;overflow:hidden}
.ath img{width:100%;height:100%;object-fit:cover}
.ainf{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ainf input,.ainf select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:15px Onest,sans-serif;width:100%;min-width:0}
#anew select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px Onest,sans-serif}
.al{display:flex;gap:6px;align-items:center}
.al button,.fl{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font:500 14px Onest,sans-serif}
#anew{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.fl{position:relative;overflow:hidden;display:inline-block}
.fl.big{display:block;text-align:center;padding:12px;font-size:16px}
.fin{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand{display:flex;flex-direction:column;align-items:center;margin:6px 0 4px}
.brand img{width:min(280px,70vw);height:auto;border-radius:50%;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.slogan{margin:14px 0 0;font:600 17px/1.35 Onest,sans-serif;text-align:center;color:var(--ink)}
.subt{margin:10px auto 0;text-align:center;color:var(--mute);max-width:52ch}
a.main2{display:block;text-align:center;text-decoration:none}
#fdlg{width:min(560px,96vw)}
#ff{width:100%;height:68vh;border:0;border-radius:8px;background:#fff}
#fx{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit}
.main2{padding:11px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font:600 15px Onest,sans-serif;cursor:pointer}
#aout{background:none;border:0;text-decoration:underline;cursor:pointer;font:inherit;text-align:left;padding:0;margin-top:6px}
#atk{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px Onest,sans-serif;width:100%}
</style>
